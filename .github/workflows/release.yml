name: Release

# Parte quando si pubblica un tag di versione, ad esempio v0.1.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Su Windows evita di dover installare NASM per compilare la libreria TLS.
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 per restare compatibili con distribuzioni meno recenti.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust stabile
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p renbot -p renbot-cli

      - name: Pacchetto
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="renbot-${GITHUB_REF_NAME}-${PLATFORM}"
          BIN="target/${TARGET}/release"
          mkdir -p "dist/${NAME}"
          cp README.md LICENSE "dist/${NAME}/"
          case "${RUNNER_OS}" in
            Windows)
              cp "${BIN}/renbot.exe" "${BIN}/renbot-cli.exe" "dist/${NAME}/"
              (cd dist && 7z a -tzip "${NAME}.zip" "${NAME}" > /dev/null)
              ;;
            macOS)
              # Applicazione avviabile dal Finder, più l'eseguibile da terminale.
              APP="dist/${NAME}/renbot.app"
              mkdir -p "${APP}/Contents/MacOS"
              cp "${BIN}/renbot" "${APP}/Contents/MacOS/renbot"
              cat > "${APP}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>renbot</string>
            <key>CFBundleDisplayName</key><string>renbot</string>
            <key>CFBundleIdentifier</key><string>io.github.ildoddo.renbot</string>
            <key>CFBundleExecutable</key><string>renbot</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
              # Firma locale (non notarizzata): serve perché l'app si avvii su Apple Silicon.
              codesign --force --deep --sign - "${APP}"
              cp "${BIN}/renbot-cli" "dist/${NAME}/"
              (cd dist && tar -czf "${NAME}.tar.gz" "${NAME}")
              ;;
            *)
              cp "${BIN}/renbot" "${BIN}/renbot-cli" "dist/${NAME}/"
              (cd dist && tar -czf "${NAME}.tar.gz" "${NAME}")
              ;;
          esac
          rm -rf "dist/${NAME}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Pubblica la release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # La release nasce come bozza: va controllata e pubblicata a mano da GitHub.
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "renbot ${GITHUB_REF_NAME}" \
            --generate-notes \
            --draft
