[package]
name = "renbot-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["ildoddo"]
repository = "https://github.com/ildoddo/renbot"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
renbot-core = { version = "0.1.0", path = "../renbot-core" }
tokio = { version = "1.54.1", features = ["rt", "macros"] }

[[bin]]
name = "renbot-cli"
path = "src/main.rs"

[dev-dependencies]
renbot-core = { path = "../renbot-core", features = ["test-util"] }
