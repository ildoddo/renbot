[package]
name = "renbot-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["ildoddo"]
repository = "https://github.com/ildoddo/renbot"

[dependencies]
directories = "6.0.0"
keyring = "4.2.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
walkdir = "2.5.0"

[features]
# Espone gli strumenti di prova (client HTTP e database simulati) agli altri crate.
test-util = []
